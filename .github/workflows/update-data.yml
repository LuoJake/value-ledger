name: Update SEC fundamentals

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official SEC data
        env:
          SEC_USER_AGENT: "ValueLedger/1.0 ${{ vars.SEC_CONTACT_EMAIL }}"
        run: python scripts/fetch_sec_data.py
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/fundamentals.json
          git diff --cached --quiet || git commit -m "data: refresh SEC fundamentals"
          git push
